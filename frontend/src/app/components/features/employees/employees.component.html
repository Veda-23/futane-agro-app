<div class="grid-cols-3">
  <div class="glass-panel form-card" style="grid-column: span 1; padding: 20px;" *ngIf="!isViewer()">
    <h3>{{ 'hr.add_title' | translate:currentLang }}</h3>
    <form (submit)="saveEmployee()">
      <div class="form-group">
        <label>{{ 'hr.name' | translate:currentLang }}</label>
        <input appAutoSelect type="text" [(ngModel)]="employeeForm.empName" name="eName" required placeholder="Worker name">
      </div>
      <div class="form-group">
        <label>{{ 'hr.designation' | translate:currentLang }}</label>
        <input appAutoSelect type="text" [(ngModel)]="employeeForm.designation" name="eDesig" required placeholder="Role (e.g. Operator, Accountant)">
      </div>
      <div class="form-group">
        <label>{{ 'hr.mobile' | translate:currentLang }}</label>
        <input appAutoSelect type="text" [(ngModel)]="employeeForm.empContact" name="eContact" required placeholder="10-digit mobile">
      </div>
      <div class="form-group">
        <label>{{ 'hr.salary' | translate:currentLang }}</label>
        <input appAutoSelect type="number" [(ngModel)]="employeeForm.salary" name="eSalary" required>
      </div>
      <div class="form-group">
        <label>{{ 'hr.aadhaar' | translate:currentLang }}</label>
        <input appAutoSelect type="text" [(ngModel)]="employeeForm.aadhaarNo" name="eAadhaar" required placeholder="12-digit Aadhaar Card number">
      </div>
      <div class="form-group">
        <label>{{ 'hr.bank' | translate:currentLang }}</label>
        <input appAutoSelect type="text" [(ngModel)]="employeeForm.bankAccount" name="eBank" required placeholder="IFS Code / Account No">
      </div>
      <div class="form-group">
        <label>{{ 'hr.joining_date' | translate:currentLang }}</label>
        <input appAutoSelect type="date" [(ngModel)]="employeeForm.joiningDate" name="eJoin" required>
      </div>
      <div class="form-group">
        <label>{{ 'hr.address' | translate:currentLang }}</label>
        <input appAutoSelect type="text" [(ngModel)]="employeeForm.address" name="eAddr" required placeholder="Residential address">
      </div>
      <button type="submit" class="btn btn-success" style="width: 100%;">{{ 'hr.register_btn' | translate:currentLang }}</button>
    </form>
  </div>
  <div class="glass-panel table-card" [style.grid-column]="isViewer() ? 'span 3' : 'span 2'" style="padding: 20px;">
    <h3>{{ 'hr.records_title' | translate:currentLang }}</h3>
    
    <div class="table-container" style="margin-top: 15px;">
      <app-data-table 
        [data]="employees" 
        [columns]="employeeTableColumns" 
        [actions]="employeeTableActions" 
        (actionClicked)="handleEmployeeAction($event)"
        searchPlaceholder="Search Employees...">
      </app-data-table>
    </div>
  </div>
</div>
