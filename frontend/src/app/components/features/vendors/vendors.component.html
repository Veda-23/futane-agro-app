<div class="grid grid-cols-3">
  <div class="card" style="grid-column: span 1;" *ngIf="!isViewer()">
    <h3>{{ 'vendor.add_title' | translate:currentLang }}</h3>
    <form #vendorNgForm="ngForm" (submit)="saveVendor()">
      <div class="form-group">
        <label>{{ 'vendor.name' | translate:currentLang }}</label>
        <input class="form-control" type="text" [(ngModel)]="vendorForm.vendorName" name="vName" #vNameRef="ngModel" required minlength="2" placeholder="Company/Supplier name">
        <div *ngIf="vNameRef.invalid && (vNameRef.dirty || vNameRef.touched)" class="error-text">
          <small *ngIf="vNameRef.errors?.['required']">Vendor name is required.</small>
          <small *ngIf="vNameRef.errors?.['minlength']">Must be at least 2 characters.</small>
        </div>
      </div>
      <div class="form-group">
        <label>{{ 'vendor.mobile' | translate:currentLang }}</label>
        <input class="form-control" type="text" [(ngModel)]="vendorForm.mobile" name="vMobile" #vMobileRef="ngModel" required pattern="^\d{10}$" placeholder="10-digit mobile">
        <div *ngIf="vMobileRef.invalid && (vMobileRef.dirty || vMobileRef.touched)" class="error-text">
          <small *ngIf="vMobileRef.errors?.['required']">Mobile is required.</small>
          <small *ngIf="vMobileRef.errors?.['pattern']">Must be exactly 10 digits.</small>
        </div>
      </div>
      <div class="form-group">
        <label>{{ 'vendor.address' | translate:currentLang }}</label>
        <input class="form-control" type="text" [(ngModel)]="vendorForm.address" name="vAddress" required placeholder="Office street address">
      </div>
      <div class="form-group">
        <label>{{ 'vendor.gst' | translate:currentLang }}</label>
        <input class="form-control" type="text" [(ngModel)]="vendorForm.gstNumber" name="vGst" #vGstRef="ngModel" required pattern="^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$" placeholder="15-digit GSTIN">
        <div *ngIf="vGstRef.invalid && (vGstRef.dirty || vGstRef.touched)" class="error-text">
          <small *ngIf="vGstRef.errors?.['required']">GST is required.</small>
          <small *ngIf="vGstRef.errors?.['pattern']">Invalid GST Number format.</small>
        </div>
      </div>
      <button type="submit" class="btn btn-success" [disabled]="vendorNgForm.invalid" style="width: 100%; margin-top: 16px;">{{ 'vendor.register_btn' | translate:currentLang }}</button>
    </form>
  </div>
  <div class="card" [style.grid-column]="isViewer() ? 'span 3' : 'span 2'">
    <h3>{{ 'vendor.records_title' | translate:currentLang }}</h3>
    
    <div class="table-responsive" style="margin-top: 15px;">
      <app-data-table 
        [data]="vendors" 
        [columns]="vendorTableColumns" 
        [actions]="vendorTableActions" 
        (actionClicked)="handleVendorAction($event)"
        searchPlaceholder="Search Vendors...">
      </app-data-table>
    </div>
  </div>
</div>
