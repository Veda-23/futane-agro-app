<div class="filter-card">
  <div class="filter-header" (click)="toggleVisibility.emit()" style="cursor: pointer;">
    <div class="filter-title">
      <div class="filter-icon">🔍</div>
      <h3>Global Data Filters</h3>
      <span *ngIf="filters.query || filters.date || filters.month" class="active-pill">Active Filter</span>
    </div>
    <div class="filter-actions">
      <button type="button" class="btn-reset" (click)="$event.stopPropagation(); reset.emit()">Reset Filters</button>
      <button type="button" class="btn-export" (click)="$event.stopPropagation(); export.emit()">Export Filtered (CSV)</button>
    </div>
  </div>
  
  <div *ngIf="showFilters" class="filter-body">
    <div class="filter-grid">
      <div class="form-field">
        <label class="field-label">SEARCH QUERY</label>
        <div class="input-wrapper">
          <input appAutoSelect type="text" class="custom-input" [(ngModel)]="filters.query" (ngModelChange)="onFilterChange()" placeholder="Type to search...">
          <button *ngIf="filters.query" (click)="filters.query = ''; onFilterChange()" type="button" class="clear-btn" title="Clear Search">✕</button>
        </div>
      </div>

      <div class="form-field">
        <label class="field-label">DATE FILTER</label>
        <div class="input-wrapper">
          <input appAutoSelect type="date" class="custom-input" [(ngModel)]="filters.date" (ngModelChange)="onFilterChange()">
        </div>
      </div>

      <div class="form-field">
        <label class="field-label">MONTH FILTER</label>
        <div class="input-wrapper">
          <select class="custom-select" [(ngModel)]="filters.month" (ngModelChange)="onFilterChange()">
            <option value="">All Months</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
