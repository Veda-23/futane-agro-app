<div class="card p-0 mb-6" style="overflow: hidden;">
  <!-- Filter Header (Accordion Toggle) -->
  <div class="card-header m-0 p-4" (click)="toggleVisibility.emit()" style="cursor: pointer; border-bottom: none; display: flex; justify-content: space-between; align-items: center; background: var(--bg-primary);">
    <div class="flex items-center gap-3">
      <span class="icon text-primary">🔍</span>
      <h3 class="h4 m-0">Global Data Filters</h3>
    </div>
    <div class="flex items-center gap-2">
      <!-- Stop propagation so clicking buttons doesn't collapse the filter -->
      <button type="button" class="btn btn-secondary btn-sm" (click)="$event.stopPropagation(); reset.emit()">Reset Filters</button>
      <button type="button" class="btn btn-success btn-sm" (click)="$event.stopPropagation(); export.emit()">Export CSV</button>
      <span class="text-muted ml-2" [style.transform]="showFilters ? 'rotate(180deg)' : 'rotate(0)'" style="transition: transform 0.3s ease;">▼</span>
    </div>
  </div>
  
  <!-- Filter Body -->
  <div *ngIf="showFilters" class="card-body p-4 pt-0" style="border-top: 1px solid var(--border-light);">
    <div class="form-grid mt-4">
      <div class="form-group mb-0">
        <label>Search Query</label>
        <input type="text" class="form-control" [(ngModel)]="filters.query" (ngModelChange)="onFilterChange()" placeholder="Type to search...">
      </div>
      <div class="form-group mb-0">
        <label>Date Filter</label>
        <input type="date" class="form-control" [(ngModel)]="filters.date" (ngModelChange)="onFilterChange()">
      </div>
      <div class="form-group mb-0">
        <label>Month Filter</label>
        <select class="form-control" [(ngModel)]="filters.month" (ngModelChange)="onFilterChange()">
          <option value="">All Months</option>
          <option value="January">January</option>
          <option value="February">February</option>
          <option value="March">March</option>
          <option value="April">April</option>
          <option value="May">May</option>
          <option value="June">June</option>
          <option value="July">July</option>
          <option value="August">August</option>
          <option value="September">September</option>
          <option value="October">October</option>
          <option value="November">November</option>
          <option value="December">December</option>
        </select>
      </div>
    </div>
  </div>
</div>
