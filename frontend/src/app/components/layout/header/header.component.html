<header class="header glass-panel">
  <div class="header-left" style="display: flex; align-items: center; gap: 20px;">
    <button class="mobile-menu-btn" (click)="toggleSidebar()">☰</button>
    <div class="header-logo-brand">
      <span class="logo-icon">🏭</span>
      <span style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: var(--accent-orange);">FUTANE AGRO ERP</span>
    </div>
    <span class="header-divider" style="color: var(--border-glass);">|</span>
    <h2 style="font-size: 18px; font-weight: 700; margin: 0; color: var(--text-primary);">{{ activeTab | uppercase }}</h2>
    <div class="header-datetime" style="font-size: 13px; font-weight: 600; color: var(--text-secondary); background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px;">
      📅 <span>{{ currentDateTimeString }}</span>
    </div>
  </div>
  <div class="header-right">
    <!-- Developer setting (API URL field): ONLY visible to Super Admin in UAT mode -->
    <div class="backend-config" *ngIf="!isProduction && loggedInUser?.role === 'SUPER_ADMIN'" style="margin-right: 15px; display: flex; align-items: center; gap: 5px;">
      <span style="font-size: 11px; color: var(--text-secondary); font-weight: 500;">API:</span>
      <input type="text" [(ngModel)]="customBackendUrl" (change)="saveBackendUrl()" placeholder="Backend URL" style="padding: 4px 8px; font-size: 11px; border: 1px solid var(--border-color); border-radius: 4px; background: rgba(0,0,0,0.2); color: var(--text-primary); width: 180px;">
    </div>

    <!-- Notification Bell -->
    <div class="notification-bell" style="font-size: 20px; cursor: pointer; position: relative; margin-right: 15px;">
      🔔
      <span class="bell-dot" style="position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--accent-red); border-radius: 50%;"></span>
    </div>

    <!-- Language Switcher -->
    <div class="lang-switcher">
      <button class="lang-btn" [class.lang-active]="currentLang === 'en'" (click)="setLanguage('en')">EN</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" [class.lang-active]="currentLang === 'mr'" (click)="setLanguage('mr')">मराठी</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" [class.lang-active]="currentLang === 'hi'" (click)="setLanguage('hi')">हिंदी</button>
    </div>
    <div class="session-info" style="display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 1.3; color: var(--text-secondary); background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
      <span style="font-weight: 600;">👤 {{ loggedInUser?.name }} ({{ loggedInUser?.role }})</span>
      <span style="font-size: 11px; color: var(--text-muted);">Session: {{ sessionDuration }} | Auto-Logout: {{ logoutCountdown }}</span>
    </div>
    <button class="btn btn-secondary btn-sm" id="signout-btn" (click)="handleLogout()">{{ 'btn.logout' | translate:currentLang }}</button>
  </div>
</header>
