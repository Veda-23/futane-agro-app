<div class="empty-state-card" [ngClass]="['variant-' + variant, compact ? 'compact-state' : '']">
  <div class="empty-state-icon-badge">
    <i class="bi" [ngClass]="icon"></i>
  </div>
  
  <div class="empty-state-text-group">
    <h3 class="empty-state-heading">{{ title }}</h3>
    <p class="empty-state-desc" *ngIf="description">{{ description }}</p>
  </div>

  <div class="empty-state-actions" *ngIf="actionLabel">
    <button type="button" class="btn empty-state-btn" (click)="onActionClick()">
      <i class="bi me-1.5" [ngClass]="actionIcon" *ngIf="actionIcon"></i>
      <span>{{ actionLabel }}</span>
    </button>
  </div>

  <div class="empty-state-hints" *ngIf="!compact">
    <span class="hint-item"><i class="bi bi-search me-1 text-primary"></i> Press <kbd>Ctrl + K</kbd> to search ERP</span>
    <span class="hint-sep">&bull;</span>
    <span class="hint-item"><i class="bi bi-arrow-repeat me-1 text-success"></i> Real-time sync</span>
    <span class="hint-sep">&bull;</span>
    <span class="hint-item"><i class="bi bi-shield-check me-1 text-info"></i> Audit verified</span>
  </div>

  <div class="empty-state-extra">
    <ng-content></ng-content>
  </div>
</div>
