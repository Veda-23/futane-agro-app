name: Futane Agro ERP - Local CI & Build Pipeline

on:
  push:
    branches:
      - main
      - enterprise-db-redesign
  pull_request:
    branches:
      - main
      - enterprise-db-redesign
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod
          - dev
      run_tests:
        description: 'Execute Unit & Integration Tests'
        required: false
        default: true
        type: boolean

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Verify Spring Boot Backend
  # -------------------------------------------------------------
  backend-build:
    name: Backend Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Application
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests -B

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: futane-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Build & Verify Angular Frontend
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Build Angular Application (UAT)
        working-directory: ./frontend
        run: |
          npm run build:uat || npx ng build --configuration=uat

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: futane-frontend-dist
          path: frontend/dist*/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Verify Docker Container Build Integrity
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Container Validation
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: futane-agro-backend:test

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.uat.yml config
