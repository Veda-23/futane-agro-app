version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: futane_postgres
    environment:
      POSTGRES_DB: futane_erp_prod
      POSTGRES_USER: futane_app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-FutaneAgro#Secure2026!App}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futane_app_user -d futane_erp_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futane_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/futane_erp_prod
      SPRING_DATASOURCE_USERNAME: futane_app_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-FutaneAgro#Secure2026!App}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
      - backend_logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futane_frontend
    ports:
      - "4300:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  backend_backups:
  backend_logs:
