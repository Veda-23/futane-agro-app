version: '3.8'

services:
  # MySQL Database Service for Production
  mysql-prod:
    image: mysql:8.0
    container_name: futane_agro_mysql_prod
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: futane_agro_prod
    volumes:
      - mysql_prod_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  # Spring Boot Backend Service for Production
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: futane-agro-app_backend-prod:latest
    container_name: futane_agro_backend_prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-prod:3306/futane_agro_prod?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - MAIL_USERNAME=vedantmehare25@gmail.com
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      mysql-prod:
        condition: service_healthy
    volumes:
      - backend_prod_uploads:/app/uploads
    restart: always
    networks:
      - prod-network

  # Angular Frontend Service for Production
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: futane-agro-app_frontend-prod:latest
    container_name: futane_agro_frontend_prod
    depends_on:
      - backend-prod
    restart: always
    networks:
      - prod-network

volumes:
  mysql_prod_data:
  backend_prod_uploads:

networks:
  prod-network:
    name: futane-prod-network
