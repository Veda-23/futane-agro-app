version: '3.8'

services:
  # MySQL Database Service for Production
  mysql-prod:
    image: mysql:8.0
    container_name: futane_agro_mysql_prod
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Vedant
      MYSQL_DATABASE: futane_agro_prod
    volumes:
      - mysql_prod_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pVedant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  # Spring Boot Backend Service for Production
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: futane-agro-app_backend-prod:latest
    container_name: futane_agro_backend_prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-prod:3306/futane_agro_prod?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Vedant
      - MAIL_USERNAME=vedantmehare25@gmail.com
      - MAIL_PASSWORD=vsbtirkwuqviuicj
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_live_TI9lR5O91bfVYR}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-PbJO3mgGxGpU9gtH6lbOWJAR}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-PbJO3mgGxGpU9gtH6lbOWJAR}
    depends_on:
      mysql-prod:
        condition: service_healthy
    volumes:
      - backend_prod_uploads:/app/uploads
    restart: always
    networks:
      - prod-network

  # Angular Frontend Service for Production
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: futane-agro-app_frontend-prod:latest
    container_name: futane_agro_frontend_prod
    depends_on:
      - backend-prod
    # No host port bindings — gateway nginx proxies to this container internally
    expose:
      - "80"
    restart: always
    networks:
      - prod-network

  # Nginx Gateway — owns ports 80/443, routes to frontend + Grafana /monitoring/
  gateway:
    image: nginx:1.25-alpine
    container_name: futane_agro_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend-prod
      - backend-prod
    restart: always
    networks:
      - prod-network
      - monitoring-network

volumes:
  mysql_prod_data:
  backend_prod_uploads:

networks:
  prod-network:
    name: futane-prod-network
  monitoring-network:
    name: futane-monitoring-network
    external: true
