# Database configuration for Production
spring.datasource.url=jdbc:mysql://localhost:3306/futane_erp_prod?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vedant}
spring.jpa.hibernate.ddl-auto=validate

# Port for Production
server.port=8080

# JWT Configurations for Production (Secure Secrets)
jwt.secret=${JWT_SECRET:FutaneAgroERPSecuritySecretKeyForJWTSigningSecureKeyPROD}
jwt.expiration=900000
jwt.refreshExpiration=604800000

# AES-256 Encryption Key for Production (Secure Encryption Key)
app.encryption.key=${APP_ENCRYPTION_KEY:FutaneAgroERPPRODEncryptionKeySe}

