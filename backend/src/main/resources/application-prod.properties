# Database configuration for Production (PostgreSQL Only)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:futane_erp_prod}?sslmode=prefer
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:futane_app_user}
spring.datasource.password=${DB_PASSWORD:FutaneAgro#Secure2026!App}
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FutaneHikariPoolPROD
spring.datasource.hikari.leak-detection-threshold=60000

# SECURITY: ddl-auto=none in production — prevent runtime schema alteration
spring.jpa.hibernate.ddl-auto=none

# SECURITY: Disable Liquibase in production
spring.liquibase.enabled=false

# Port for Production
server.port=${PORT:8080}

# JWT Configurations for Production (Requires dedicated environment variable)
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refreshExpiration=604800000

# AES-256 Encryption Key for Production (Requires dedicated environment variable)
app.encryption.key=${APP_ENCRYPTION_KEY}

# Razorpay Payment Gateway Credentials (Requires dedicated environment variables)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=futane-erp
spring.jpa.properties.hibernate.generate_statistics=false
management.endpoint.prometheus.enabled=true
management.health.mail.enabled=false

# Logging
# SECURITY: No SQL statements or parameter values in production logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
# Application-level logging — INFO for all futaneagro packages
logging.level.com.futaneagro=INFO
# SECURITY: Suppress Spring Security debug details in production
logging.level.org.springframework.security=WARN
# SECURITY: Disable open-in-view to prevent accidental lazy-loading in view layer
spring.jpa.open-in-view=false
