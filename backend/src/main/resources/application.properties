# Default Active Profile
spring.profiles.active=uat

# Common JPA / Hibernate configuration
# SECURITY: show-sql disabled by default — enabled only in dev via profile override
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ─── Security Hardening ────────────────────────────────────────────────────────

# SECURITY: Actuator — expose only health and prometheus; all others locked in SecurityConfig
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.info.env.enabled=false

# SECURITY: Disable Actuator shutdown endpoint (safety measure)
management.endpoint.shutdown.enabled=false

# SECURITY: Tomcat — reject oversized requests early (defense against payload attacks)
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# SECURITY: HTTP/2 disabled on plain HTTP without TLS to prevent proxy drop
server.http2.enabled=false

# SECURITY: Forwarded Headers for trusted proxy environments (preserves remote client IP)
server.forward-headers-strategy=framework

# SECURITY: Suppress server header information disclosure
server.server-header=

# SECURITY: Jackson — fail on unknown properties, don't expose internal types
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.mapper.default-view-inclusion=false

# SECURITY: Session management — stateless (JWT), no server-side sessions
server.servlet.session.timeout=0

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
# SECURITY: SQL debug only in non-prod via profile override
logging.level.org.hibernate.SQL=WARN
logging.level.com.futaneagro.security=INFO

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Spring Mail ──────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:vedantmehare25@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# ─── Twilio ───────────────────────────────────────────────────────────────────
twilio.account.sid=${TWILIO_ACCOUNT_SID:your_twilio_sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# ─── Liquibase ────────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.enabled=true

# ─── Performance & Scalability (100+ Concurrent Users) ───────────────────────
# GZIP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Hibernate JDBC Batch Writing & Statement Caching
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=parties,vendors,drivers,employees,machines,settings
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ─── Framework ────────────────────────────────────────────────────────────────
spring.main.allow-circular-references=true
