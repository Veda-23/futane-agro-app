# Database configuration for UAT
spring.datasource.url=jdbc:mysql://localhost:3306/futane_erp_uat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vedant}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FutaneHikariPoolUAT
# Set to none so Hibernate does not fail on existing constraint alteration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# SECURITY: Disable Liquibase in UAT — schema already exists, ddl-auto handles new columns
spring.liquibase.enabled=false

# Port for UAT
server.port=8081

# JWT Configurations for UAT
jwt.secret=${JWT_SECRET:FutaneAgroERPSecuritySecretKeyForJWTSigningSecureKeyUAT}
jwt.expiration=900000
jwt.refreshExpiration=604800000

# AES-256 Encryption Key for UAT
app.encryption.key=${APP_ENCRYPTION_KEY:FutaneAgroERPPRODEncryptionKeySe}

# Razorpay Payment (Test Mode — no real charges)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_FutaneAgro2026TestKey}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:FutaneAgro2026RazorpayTestSecret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:FutaneAgro2026WebhookTestSecret}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
logging.level.org.hibernate.SQL=WARN
