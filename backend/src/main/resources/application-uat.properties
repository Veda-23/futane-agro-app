# Database configuration for UAT (PostgreSQL Only)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:futane_erp_uat}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:futane_app_user}
spring.datasource.password=${DB_PASSWORD:FutaneAgro#Secure2026!App}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FutaneHikariPoolUAT
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SECURITY: Disable Liquibase in UAT — schema already exists, ddl-auto handles new columns
spring.liquibase.enabled=false

# Port for UAT
server.port=8081

# JWT Configurations for UAT
jwt.secret=${JWT_SECRET:FutaneAgroERPSecuritySecretKeyForJWTSigningSecureKeyUAT}
jwt.expiration=900000
jwt.refreshExpiration=604800000

# AES-256 Encryption Key for UAT
app.encryption.key=${APP_ENCRYPTION_KEY:FutaneAgroERPPRODEncryptionKeySe}

# Razorpay Payment (Test Mode — no real charges)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_FutaneAgro2026TestKey}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:FutaneAgro2026RazorpayTestSecret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:FutaneAgro2026WebhookTestSecret}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
logging.level.org.hibernate.SQL=WARN

# Performance: GZIP Compression for Fast API Transfers & Lower Browser RAM
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Performance: Hibernate JDBC Batching for Bulk Writes
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Performance: In-Memory Caffeine L1 Cache (Instant <0.5ms responses)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Multi-Factor Authentication (MFA)
auth.mfa.firebase.enabled=${AUTH_MFA_FIREBASE_ENABLED:false}
auth.mfa.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
auth.mfa.firebase.pre-auth-token-expiration-seconds=300
auth.mfa.firebase.allowed-clock-skew-seconds=60
