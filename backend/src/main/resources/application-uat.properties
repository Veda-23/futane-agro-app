# Database configuration for UAT
spring.datasource.url=jdbc:mysql://localhost:3306/futane_erp_uat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vedant}
spring.datasource.hikari.maximum-pool-size=50
spring.jpa.hibernate.ddl-auto=validate

# Port for UAT
server.port=8081

# JWT Configurations for UAT
jwt.secret=${JWT_SECRET:FutaneAgroERPSecuritySecretKeyForJWTSigningSecureKeyUAT}
jwt.expiration=900000
jwt.refreshExpiration=604800000

# AES-256 Encryption Key for UAT
app.encryption.key=${APP_ENCRYPTION_KEY:FutaneAgroERPUATEncryptionKeySec}

# Razorpay Payment Links (UAT - test mode keys)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_test_dummy_key_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:rzp_test_dummy_webhook}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
