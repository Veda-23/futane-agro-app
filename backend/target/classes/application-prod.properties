# Database configuration for Production
spring.datasource.url=jdbc:mysql://localhost:3306/futane_erp_prod?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vedant}
spring.jpa.hibernate.ddl-auto=update

# Port for Production
server.port=8080

# JWT Configurations for Production (Secure Secrets)
jwt.secret=${JWT_SECRET:FutaneAgroERPSecuritySecretKeyForJWTSigningSecureKeyPROD}
jwt.expiration=900000
jwt.refreshExpiration=604800000

# AES-256 Encryption Key for Production (Secure Encryption Key)
app.encryption.key=${APP_ENCRYPTION_KEY:FutaneAgroERPPRODEncryptionKeySe}

# Razorpay Payment Links
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Phase 5 & 6: Actuator & Prometheus Database Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=futane-erp
spring.jpa.properties.hibernate.generate_statistics=true
management.endpoint.prometheus.enabled=true
