events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Dynamic security headers (General)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # DNS resolvers for OCSP stapling lookup
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HTTP Server Block: Handles Let's Encrypt challenge and HTTPS redirects
    server {
        listen 80;
        server_name erp.futaneagro.com uat.futaneagro.com futaneagro.com www.futaneagro.com futane-agro-erp.local uat.futane-agro-erp.local 80.225.192.171 80-225-192-171.sslip.io;

        # Webroot challenge location for Certbot verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Force HTTPS redirect for all other requests
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Production Server Block (https://erp.futaneagro.com)
    server {
        listen 443 ssl;
        server_name erp.futaneagro.com futaneagro.com www.futaneagro.com futane-agro-erp.local 80.225.192.171 80-225-192-171.sslip.io;

        # Let's Encrypt Live Certificate Paths
        ssl_certificate /etc/letsencrypt/live/erp.futaneagro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/erp.futaneagro.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/erp.futaneagro.com/chain.pem;

        # Secure SSL Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_dhparam /etc/letsencrypt/dhparam.pem;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers specific to HTTPS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location / {
            proxy_pass http://futane_agro_frontend_prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # UAT Server Block (https://uat.futaneagro.com)
    server {
        listen 443 ssl;
        server_name uat.futaneagro.com uat.futane-agro-erp.local;

        # Let's Encrypt Live Certificate Paths
        ssl_certificate /etc/letsencrypt/live/uat.futaneagro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/uat.futaneagro.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/uat.futaneagro.com/chain.pem;

        # Secure SSL Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_dhparam /etc/letsencrypt/dhparam.pem;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers specific to HTTPS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location / {
            proxy_pass http://futane_agro_frontend_uat:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
