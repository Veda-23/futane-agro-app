version: '3.8'

services:
  postgres-uat:
    image: postgres:16-alpine
    container_name: futane_postgres_uat
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: futane_erp_uat
      POSTGRES_USER: futane_app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-FutaneAgro#Secure2026!App}
    volumes:
      - postgres_uat_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futane_app_user -d futane_erp_uat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uat-network

  backend-uat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futane_backend_uat
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-uat:5432/futane_erp_uat
      - SPRING_DATASOURCE_USERNAME=futane_app_user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-FutaneAgro#Secure2026!App}
      - SERVER_PORT=8081
    depends_on:
      postgres-uat:
        condition: service_healthy
    volumes:
      - backend_uat_uploads:/app/uploads
      - backend_uat_logs:/app/logs
    restart: always
    networks:
      - uat-network

  frontend-uat:
    build:
      context: ./frontend
      dockerfile: Dockerfile.uat
      args:
        - BUILD_CONFIG=uat
    container_name: futane_frontend_uat
    ports:
      - "4300:80"
    depends_on:
      - backend-uat
    restart: always
    networks:
      - uat-network

networks:
  uat-network:
    driver: bridge

volumes:
  postgres_uat_data:
  backend_uat_uploads:
  backend_uat_logs:
